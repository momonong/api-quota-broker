[project]
name = "api-quota-broker"
version = "2.0.0"
description = "Local free-tier admission and reservation for official AI APIs"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "pypdf>=7.0.0",
]

[project.optional-dependencies]
encrypted = [
    "quota-broker-ohttp==0.1.0",
    "PyJWT[crypto]==2.15.1",
    "Pillow==13.0.0",
]

[project.scripts]
quota-broker = "quota_broker.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quota_broker"]

[dependency-groups]
dev = [
    "mypy>=1.12",
    "pytest>=8.0",
    "ruff>=0.6",
    "pyhpke==0.6.5",
]

[tool.uv.sources]
quota-broker-ohttp = { path = "native/ohttp" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src/quota_broker"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
