[project]
name = "api-quota-broker"
version = "0.1.0"
description = "Local free-tier admission and reservation for official AI APIs"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
quota-broker = "quota_broker.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quota_broker"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
