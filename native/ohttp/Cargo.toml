[package]
name = "quota-broker-ohttp"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "quota_broker_ohttp"
crate-type = ["cdylib"]

[dependencies]
ohttp = { version = "=0.8.0", default-features = false, features = ["client", "server", "rust-hpke"] }
bhttp = { version = "=0.8.0", default-features = false }
pyo3 = { version = "=0.30.1", features = ["abi3-py312"] }
